server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: ai-healthcare-copilot-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:healthcopilotdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  # H2 console is OFF by default. For local debugging only: set H2_CONSOLE_ENABLED=true
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: ${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

app:
  jwt:
    # REQUIRED: no default on purpose. Set JWT_SECRET (long random string) locally and on Render.
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
  cors:
    # Comma-separated. On Render set CORS_ALLOWED_ORIGINS=https://your-app.vercel.app
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://*.vercel.app,http://localhost:*}

logging:
  level:
    root: INFO
    com.healthcopilot: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN