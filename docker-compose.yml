version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: healthcopilot-postgres
    environment:
      POSTGRES_DB: healthcopilot
      POSTGRES_USER: healthadmin
      POSTGRES_PASSWORD: healthpassword123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthadmin -d healthcopilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: healthcopilot-ai-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - MOCK_MODE=${MOCK_MODE:-true}
    volumes:
      - ./ai-service:/app

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthcopilot-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/healthcopilot
      - SPRING_DATASOURCE_USERNAME=healthadmin
      - SPRING_DATASOURCE_PASSWORD=healthpassword123
      - AI_SERVICE_URL=http://ai-service:8000
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: healthcopilot-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
